# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "prompt-wars"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[db.migrations]
# Specifies an ordered list of schema files that describe your database.
# Supports glob patterns relative to supabase directory: "./schemas/*.sql"
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
# Disabled: starter content is seeded idempotently by migration
# 20260512195500_seed_starter_content.sql, which runs on both hosted
# (`db push`) and local (`db reset`) environments. Re-running the legacy
# ./seed.sql on top of that migration caused duplicate-key failures.
enabled = false
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Uncomment to configure local storage buckets
# [storage.buckets.videos]
# public = false
# file_size_limit = "50MiB"
# 
# [storage.buckets.thumbnails]
# public = true
# file_size_limit = "5MiB"
# 
# [storage.buckets.avatars]
# public = true
# file_size_limit = "5MiB"

# RevenueCat posts webhooks with its own Authorization header (validated against
# REVENUECAT_WEBHOOK_SECRET in-function), not a Supabase JWT — so platform JWT
# verification must be disabled for this endpoint.
[functions.revenuecat-webhook]
verify_jwt = false

# These functions validate user JWTs or service secrets in-function via
# `_shared/utils.ts`. Platform verification cannot validate the project's
# asymmetric user JWTs and also rejects `sb_secret_` service chaining.
[functions.submit-prompt]
verify_jwt = false

[functions.resolve-battle]
verify_jwt = false

[functions.round-resolve]
verify_jwt = false

[functions.battle-advance]
verify_jwt = false

[functions.process-video-job]
verify_jwt = false

[functions.moderate-video]
verify_jwt = false

[functions.request-video-upgrade]
verify_jwt = false

[functions.sign-battle-video]
verify_jwt = false

# Validates the user JWT in-function via getAuthUserId, then deletes the auth
# user. Same asymmetric-JWT reason as the block above.
[functions.delete-account]
verify_jwt = false

# Service-role only, gated in-function by hasSupabaseSecretAuthorization.
[functions.moderation-queue]
verify_jwt = false


# ---------------------------------------------------------------------------
# User-JWT functions: platform verification MUST stay off.
#
# This project issues ASYMMETRIC user JWTs (SUPABASE_JWKS is configured). The
# Edge gateway cannot validate them and rejects the request before the function
# runs, with:
#
#     401 {"code":"UNAUTHORIZED_ASYMMETRIC_JWT","message":"Invalid JWT"}
#
# which surfaces in the app as "TypeError: Network request failed" -- reported
# against portrait regeneration, "See new look", and the face-off screen.
#
# Every function below validates the caller itself via getAuthUserId() in
# `_shared/utils.ts`, so platform verification is redundant as well as fatal.
# Turning it off does NOT weaken auth: the in-function check is the real gate.
#
# If you add a user-initiated function, it belongs here too.
# ---------------------------------------------------------------------------

[functions.account-farm-guard]
verify_jwt = false

[functions.appeal-battle]
verify_jwt = false

[functions.block-profile]
verify_jwt = false

[functions.cosmetics]
verify_jwt = false

[functions.create-custom-signature-item]
verify_jwt = false

[functions.daily-meta]
verify_jwt = false

[functions.dev-generate-video]
verify_jwt = false

[functions.edit-character]
verify_jwt = false

[functions.finalize-character-creation]
verify_jwt = false

[functions.first-time-offer]
verify_jwt = false

[functions.generate-portrait]
verify_jwt = false

[functions.grant-credits]
verify_jwt = false

[functions.leave-battle]
verify_jwt = false

[functions.list-signature-items-catalog]
verify_jwt = false

[functions.matchmaking]
verify_jwt = false

[functions.moderate-prompt]
verify_jwt = false

[functions.regenerate-portrait]
verify_jwt = false

[functions.report-intake]
verify_jwt = false

[functions.sign-battle-portraits]
verify_jwt = false

[functions.unblock-profile]
verify_jwt = false

# Validates the user JWT in-function via getAuthUserId. Same asymmetric-JWT
# reason as every entry above: the gateway cannot verify this project's user
# tokens, so leaving verification on returns UNAUTHORIZED_ASYMMETRIC_JWT before
# the handler ever runs.
[functions.generate-move-suggestions]
verify_jwt = false
